# /etc/ipsec.conf on Ubuntu B (RIGHT / responder)
# Mirror of Ubuntu A's config. Left/right values are swapped so
# strongSwan can recognize which side it is running on.

config setup
    charondebug="ike 2, esp 2, cfg 2"
    uniqueids=yes

conn %default
    keyexchange=ikev2
    authby=psk
    dpdaction=restart
    dpddelay=30s
    dpdtimeout=120s

conn net-a-to-net-b
    left=192.168.10.20
    leftsubnet=192.168.10.20/32
    leftid=@ubuntuB
    right=192.168.10.10
    rightsubnet=192.168.10.0/24
    rightid=@ubuntuA
    ike=aes256gcm16-prfsha384-ecp384!
    esp=aes256gcm16-ecp384!
    ikelifetime=8h
    keylife=1h
    rekeymargin=9m
    keyingtries=%forever
    auto=add
    type=tunnel
